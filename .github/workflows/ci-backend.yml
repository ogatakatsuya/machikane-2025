name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'indoor/backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'indoor/backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./indoor/backend
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: indoor/backend/go.sum

      - name: download-dependencies
        run: go mod download

      - name: verify-dependencies
        run: go mod verify

      - name: build
        run: go build -v ./cmd/main.go

      - name: run-tests
        run: go test -v ./...