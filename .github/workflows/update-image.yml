name: upload-image

on:
  push:
    branches:
      - main

jobs:
    upload:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: 対象ブランチをクローン
              uses: actions/checkout@v4

            - name: AWSの認証情報を設定
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: 'arn:aws:iam::794038226787:role/githubaction-ecr-push-machikane-2025'
                aws-region: ap-northeast-1
                role-duration-seconds: 900 

            - name: ECRにログイン
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Image Build & Push to ECR
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                REPOSITORY_NAME: "machikane-2025"
                IMAGE_TAG: "${{ github.sha }}"
              run: |
                cd backend
                docker build --platform linux/x86_64 -t $ECR_REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG .
                docker push $ECR_REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG
                